# MSM DRM 驱动参数（Adreno GPU render-only 模式）
#
# 这台设备没有显示面板，GPU 只用来提供 render 节点。msm.ko 默认会把 GPU 当作
# 显示管线的组件去绑定（component framework），在没有 MDP/MDSS/DSI 时必然失败。
#
# separate_gpu_kms=1 让驱动改走 msm_gpu_probe() 的独立路径（见 msm_drv.c 的
# msm_gpu_no_components()），只注册一个 DRM render 设备：
#   /dev/dri/renderD128
# 这个节点可以给 mesa/freedreno 做 EGL/GL 渲染，不需要 KMS。
#
# 验证：modprobe msm 后 `ls /dev/dri/` 应出现 renderD128，
#       `cat /sys/class/drm/renderD128/device/uevent` 能看到 adreno。
options msm separate_gpu_kms=1
