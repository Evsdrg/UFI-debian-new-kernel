# OpenStick i3status 配置（i3 底栏数据源）
# MF32 上想看电量：加 'order += "battery 0"' 与 battery 块（路径实机校准）。
general {
    colors = true
    interval = 5
}

order += "wireless _first_"
order += "ethernet _first_"
order += "load"
order += "time"

wireless _first_ {
    format_up = "W %essid %ip"
    format_down = "W --"
}

ethernet _first_ {
    format_up = "E %ip"
    format_down = "E --"
}

load {
    format = "L %1min"
}

time {
    format = "%m-%d %H:%M"
}
