# USB 共享：PC 侧 DHCP + DNS（native 档；NM 档由 NM 内置 dnsmasq 干这活）
interface=usb0
bind-dynamic
dhcp-range=10.42.0.10,10.42.0.50,12h
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.1
# DHCP option 26 = Interface MTU。usb0 侧 MTU 1400（见 10-usb0.network），
# 必须也告诉 PC，否则 PC 仍按 1500 发大包，转发到 PPPoE 上游时被丢。
dhcp-option=option:mtu,1400
# DNS 转发（不读 /etc/resolv.conf，避免环路）
no-resolv
server=223.6.6.6
server=119.29.29.29
cache-size=500
# 不传 log-queries/log-dhcp，保持默认关闭。
