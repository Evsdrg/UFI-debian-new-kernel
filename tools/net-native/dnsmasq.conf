# USB 共享：PC 侧 DHCP + DNS（native 档；NM 档由 NM 内置 dnsmasq 干这活）
interface=usb0
bind-interfaces
dhcp-range=10.42.0.10,10.42.0.50,12h
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.1
# DNS 转发（不读 /etc/resolv.conf，避免环路）
no-resolv
server=223.6.6.6
server=119.29.29.29
cache-size=500
log-queries=no
log-dhcp=no
