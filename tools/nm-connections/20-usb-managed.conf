# Debian 默认通过 udev 将 gadget 标为 unmanaged；本项仅接管本工程 usb0。
#
# ignore-carrier=1：gadget 侧在 USB 主机断开/复位时，gether_disconnect() 会
# netif_carrier_off()，但 netdev 本身仍在。NM 默认在 carrier 丢失超过
# carrier-wait-timeout（6s）后把连接判定为断开；USB 主机复位、休眠唤醒、
# 线缆瞬断都会触发这条路径，表现为"RNDIS 自己断开"。
# 忽略 carrier 后，active 连接（含 shared 模式）在 carrier 丢失时保持激活，
# carrier 回来即可继续收发，不需要重新激活、也不会重新分配地址。
[device-openstick-usb]
match-device=interface-name:usb0
managed=1
ignore-carrier=1
